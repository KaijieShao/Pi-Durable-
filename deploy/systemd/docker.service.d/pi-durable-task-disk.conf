# Pi Durable: Docker's data lives on the task disk (spec/deployment.md § Disk and Data: "If the task disk isn't mounted
# at startup, Docker and the Coordinator don't start, so task writes can never land on the boot disk").
#
#   sudo install -D -m 0644 deploy/systemd/docker.service.d/pi-durable-task-disk.conf \
#     /etc/systemd/system/docker.service.d/pi-durable-task-disk.conf
#   sudo systemctl daemon-reload
[Unit]
RequiresMountsFor=/mnt/pi-durable-tasks
