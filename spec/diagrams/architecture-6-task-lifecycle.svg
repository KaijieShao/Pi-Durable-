<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-labelledby="task-flow-title task-flow-desc"><title id="task-flow-title">Task lifecycle</title><desc id="task-flow-desc">A queued task is dispatched to running. When the run ends, the task is in review with its pull request. A follow-up or conflict fix queues another run of the same task. Approval moves it to merging; if main moved or there is a conflict, it returns to review; if the tests pass, it is merged. A queued task may be cancelled; a running task may fail or be cancelled. Group states normal, sealing and frozen apply separately.</desc><defs><marker id="state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666"/></marker></defs><g fill="#fafafa" stroke="#d0d0d0"><rect x="20" y="40" width="140" height="52" rx="7"/><rect x="238" y="40" width="140" height="52" rx="7"/><rect x="456" y="40" width="164" height="52" rx="7"/><rect x="238" y="148" width="140" height="52" rx="7"/><rect x="456" y="148" width="164" height="52" rx="7"/><rect x="456" y="242" width="164" height="52" rx="7" stroke="#16a34a"/></g><g stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#state-arrow)"><path d="M160 66H238"/><path d="M378 66H456"/><path d="M90 92C90 220 308 230 308 202"/><path d="M308 92V148"/><path d="M520 92V148"/><path d="M572 148V92"/><path d="M538 200V242"/><path d="M500 40C500 -2 120 -2 120 40"/></g><g fill="#222" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle"><text x="90" y="71">Queued</text><text x="308" y="71">Running</text><text x="538" y="71">In review</text><text x="150" y="226" font-size="11" fill="#52525b">/cancel</text><text x="308" y="179" font-size="14">Failed · Cancelled</text><text x="538" y="179">Merging</text><text x="538" y="273">Merged</text><text x="310" y="30" font-size="11" fill="#52525b">follow-up or conflict fix starts another run</text><text x="512" y="124" font-size="11" text-anchor="end" fill="#52525b">/approve</text><text x="580" y="118" font-size="11" text-anchor="start" fill="#52525b">main moved</text><text x="580" y="132" font-size="11" text-anchor="start" fill="#52525b">or conflict</text><text x="546" y="226" font-size="11" text-anchor="start" fill="#52525b">tests pass</text><text x="350" y="324" font-size="13">Group state is separate from task state: Normal · Sealing · Frozen</text><text x="350" y="346" font-size="12">Group frozen blocks dispatch and merges; it is not a task state.</text></g></svg>
