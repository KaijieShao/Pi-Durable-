<svg aria-labelledby="dgat dgad" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="group" viewbox="0 0 780 630" xmlns="http://www.w3.org/2000/svg"><title id="dgat">Where things run and who can touch what</title><desc id="dgad">One VM contains a trusted-components zone and separate untrusted task containers. The model relay is inside the Coordinator process. The Coordinator starts the isolated evaluator after sealing. Execution stays held until the evaluator exits and cleanup is verified. The Coordinator alone holds the git repository and the GitHub connection; task containers mount only their task's worktree.</desc><defs><marker id="ag" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#71717a"></path></marker><marker id="ab" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#2563eb"></path></marker><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#dc2626"></path></marker></defs><rect fill="#fff" height="594" rx="14" stroke="#a1a1aa" stroke-width="1.5" width="500" x="110" y="18"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="126" y="38">ONE VM · OUTER BOUNDARY</text><rect fill="#fafafa" height="360" rx="12" stroke="#e4e4e7" width="480" x="120" y="54"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="136" y="74">TRUSTED COMPONENTS</text><rect fill="#fff" height="146" rx="12" stroke="#a1a1aa" stroke-dasharray="6 4" width="480" x="120" y="446"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="136" y="466">TASK CONTAINERS · PER TASK · UNTRUSTED CODE</text><rect class="bx" fill="#fafafa" height="44" rx="9" stroke="#a1a1aa" stroke-width="1.5" width="80" x="10" y="92"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="50.0" y="118.5">User</text><g aria-label="Telegram bot" class="hit" data-role="Telegram bot. Receives commands and posts status to the thread." role="button" tabindex="0"><rect class="bx" fill="#fff" height="44" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="120" x="128" y="92"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="188.0" y="118.5">Telegram bot</text></g><rect fill="#fff" height="116" rx="10" stroke="#2563eb" stroke-width="1.5" width="310" x="280" y="92"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="296" y="112">COORDINATOR PROCESS</text><g aria-label="Coordinator" class="hit" data-role="Coordinator, the collaboration layer. Saves each command before acknowledging it, maps each task to its Pi conversation, and routes new tasks and follow-ups." role="button" tabindex="0"><rect class="bx" fill="#fff" height="56" rx="9" stroke="#2563eb" stroke-width="1.5" width="140" x="296" y="132"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="366.0" y="156.5">Coordinator</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="366.0" y="172.5">SQLite</text></g><g aria-label="Model relay" class="hit" data-role="Model relay. Runs inside the Coordinator process. Every model call goes through it. It accepts only an open run key." role="button" tabindex="0"><rect class="bx" fill="#fff" height="56" rx="9" stroke="#2563eb" stroke-width="1.5" width="124" x="452" y="132"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="514.0" y="156.5">Model relay</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="514.0" y="172.5">key, budget, requests</text></g><g aria-label="Owner CLI" class="hit" data-role="Owner CLI. Local operator control." role="button" tabindex="0"><rect class="bx" fill="#fff" height="44" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="120" x="128" y="164"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="188.0" y="190.5">Owner CLI</text></g><g aria-label="Watchdog" class="hit" data-role="Watchdog. An independent stop path. It terminates processes and containers and verifies they're gone." role="button" tabindex="0"><rect class="bx" fill="#fff" height="44" rx="9" stroke="#dc2626" stroke-width="1.5" width="120" x="128" y="250"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="188.0" y="276.5">Watchdog</text></g><g aria-label="Pi process" class="hit" data-role="Pi Durable 1.5.0, one process per run. Supplies the agent loop, the persistent conversation, the inbox, deduplication by requestId, abort and tool hooks." role="button" tabindex="0"><rect class="bx" fill="#fff" height="44" rx="9" stroke="#2563eb" stroke-width="1.5" width="156" x="280" y="250"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="358.0" y="268.5">Pi process</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="358.0" y="284.5">one per run</text></g><rect class="bx" fill="#fafafa" height="50" rx="9" stroke="#a1a1aa" stroke-width="1.5" width="120" x="650" y="62"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="710.0" y="83.5">GitHub</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="710.0" y="99.5">main · pull requests</text><path d="M590 100H648" fill="none" marker-end="url(#ag)" stroke="#71717a" stroke-width="1.5"></path><g aria-label="Git repository" class="hit" data-role="Git repository. A local clone on the VM disk with one worktree per open task. Only the Coordinator runs git; agents never see git's internal data." role="button" tabindex="0"><rect class="bx" fill="#fff" height="44" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="116" x="456" y="236"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="514.0" y="254.5">Git repository</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="514.0" y="270.5">worktree per task</text></g><rect class="bx" fill="#fafafa" height="44" rx="9" stroke="#a1a1aa" stroke-width="1.5" width="120" x="650" y="144"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="710.0" y="170.5">Model provider</text><g aria-label="Tool hooks" class="hit" data-role="Policy hooks. Pi's tool hooks apply our permission policy." role="button" tabindex="0"><rect class="bx" fill="#fff" height="40" rx="9" stroke="#2563eb" stroke-width="1.5" width="156" x="280" y="352"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="358.0" y="376.5">Tool hooks</text></g><g aria-label="Container" class="hit" data-role="Container. Every file operation and command runs inside the task's container, with no fallback to the host. Only the task's worktree is mounted. run_check uses a separate container with the worktree read-only and a disposable scratch space." role="button" tabindex="0"><rect class="bx" fill="#fff" height="58" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="140" x="136" y="492"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="206.0" y="517.5">Tool execution</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="206.0" y="533.5">files · commands</text></g><rect fill="#fafafa" height="18" rx="9" stroke="#ececef" width="290" x="296" y="480"></rect><text fill="#15803d" font-size="11.5" x="308" y="492.5">Task worktree: read-write</text><rect fill="#fafafa" height="18" rx="9" stroke="#ececef" width="290" x="296" y="502"></rect><text fill="#52525b" font-size="11.5" x="308" y="514.5">No other worktrees, main or git data</text><rect fill="#fafafa" height="18" rx="9" stroke="#ececef" width="290" x="296" y="524"></rect><text fill="#b91c1c" font-size="11.5" x="308" y="536.5">No network · no credentials</text><rect fill="#fafafa" height="18" rx="9" stroke="#ececef" width="290" x="296" y="546"></rect><text fill="#52525b" font-size="11.5" x="308" y="558.5">run_check: separate, worktree read-only + scratch</text><g aria-label="Isolated evaluator" class="hit" data-role="Isolated evaluator. A separate trusted container, launched only by the Coordinator after sealing: sealed snapshot of main and hidden tests read-only, plus scratch, no network or credentials. Agents can't reach it." role="button" tabindex="0"><rect class="bx" fill="#fff" height="56" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="128" x="468" y="342"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="532.0" y="366.5">Isolated evaluator</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="532.0" y="382.5">trusted container</text></g><path d="M90 114H126" fill="none" marker-end="url(#ag)" stroke="#71717a" stroke-width="1.5"></path><path d="M248 114H264V160H294" fill="none" marker-end="url(#ag)" stroke="#71717a" stroke-width="1.5"></path><path d="M248 186H294" fill="none" marker-end="url(#ag)" stroke="#71717a" stroke-width="1.5"></path><path d="M358 208V248" fill="none" marker-end="url(#ag)" stroke="#71717a" stroke-width="1.5"></path><text fill="#52525b" font-size="11" text-anchor="start" x="366" y="234">start · run key</text><path d="M436 272H446V218H514V190" fill="none" marker-end="url(#ab)" stroke="#2563eb" stroke-width="1.5"></path><path d="M576 160H648" fill="none" marker-end="url(#ab)" stroke="#2563eb" stroke-width="1.5"></path><path d="M358 294V350" fill="none" marker-end="url(#ag)" stroke="#71717a" stroke-width="1.5"></path><path d="M330 392C330 430 220 430 220 490" fill="none" marker-end="url(#ag)" stroke="#71717a" stroke-width="1.5"></path><path d="M248 272H278" fill="none" marker-end="url(#ar)" stroke="#dc2626" stroke-width="1.5"></path><text fill="#dc2626" font-size="11" text-anchor="middle" x="264" y="264">stop</text><path d="M160 294V490" fill="none" marker-end="url(#ar)" stroke="#dc2626" stroke-dasharray="5 4" stroke-width="1.5"></path><text fill="#dc2626" font-size="11" text-anchor="end" x="152" y="410">stop</text><path d="M582 208V320H532V340" fill="none" marker-end="url(#ag)" stroke="#71717a" stroke-width="1.5"></path><text fill="#52525b" font-size="11" text-anchor="end" x="574" y="304">starts after sealing</text><path d="M534 446V400" fill="none" marker-end="url(#ag)" stroke="#71717a" stroke-width="1.5"></path><text fill="#52525b" font-size="11" text-anchor="end" x="526" y="434">sealed snapshot</text></svg>
