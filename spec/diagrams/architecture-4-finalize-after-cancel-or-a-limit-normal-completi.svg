<svg aria-label="Finalize after cancel or a limit. Normal completion first waits for Pi to be idle and any successor run to drain. Then close the run key, abort Pi, let in-flight work settle or freeze if unconfirmed, terminate the process and container, and verify they are gone." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" viewbox="0 0 820 300" xmlns="http://www.w3.org/2000/svg"><defs><marker id="fg" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#71717a"></path></marker><marker id="fb" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#2563eb"></path></marker><marker id="fr" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#dc2626"></path></marker></defs><rect fill="#fafafa" height="72" rx="10" stroke="#ececef" width="820" x="0" y="10"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="50">USER</text><rect fill="#fff" height="72" rx="10" stroke="#ececef" width="820" x="0" y="86"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="126">COORDINATOR</text><rect fill="#fafafa" height="72" rx="10" stroke="#ececef" width="820" x="0" y="162"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="202">PI</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="130" x="110" y="98"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="175.0" y="118.5">1. Close run key</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="175.0" y="134.5">revoke generation</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="110" x="270" y="174"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="325.0" y="202.5">2. Abort Pi</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="140" x="410" y="174"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="480.0" y="194.5">3. Settle in-flight</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="480.0" y="210.5">call or tool effect</text><rect class="bx" fill="#fef2f2" height="48" rx="9" stroke="#dc2626" stroke-width="1.5" width="140" x="410" y="98"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="480.0" y="118.5">If unconfirmed:</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="480.0" y="134.5">uncertain, freeze group</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="110" x="580" y="98"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="635.0" y="118.5">4. Terminate</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="635.0" y="134.5">process, container</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="100" x="710" y="98"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="760.0" y="126.5">Verify gone</text><path d="M240 98C258 98 255 174 268 174" fill="none" marker-end="url(#fg)" stroke="#71717a" stroke-width="1.5"></path><path d="M380 174H408" fill="none" marker-end="url(#fg)" stroke="#71717a" stroke-width="1.5"></path><path d="M480 174V148" fill="none" marker-end="url(#fr)" stroke="#dc2626" stroke-dasharray="5 4" stroke-width="1.5"></path><path d="M550 174C566 174 566 122 578 122" fill="none" marker-end="url(#fg)" stroke="#71717a" stroke-width="1.5"></path><path d="M690 98H708" fill="none" marker-end="url(#fg)" stroke="#71717a" stroke-width="1.5"></path><text fill="#52525b" font-size="11.5" text-anchor="middle" x="410.0" y="270">Finalize after cancel or a limit.</text><text fill="#52525b" font-size="11.5" text-anchor="middle" x="410.0" y="286">Normal completion first waits for Pi to be idle and any successor run to drain.</text></svg>
