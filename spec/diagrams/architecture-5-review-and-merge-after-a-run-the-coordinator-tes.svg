<svg aria-label="Review and merge: after a run, the Coordinator tests, commits and pushes the branch and opens or updates the task's pull request. The creator or owner approves that head commit. The Coordinator merges the latest main into the task branch; on a conflict nothing merges and a new run resolves it, and if main moved the result is tested and approved again. If main is unchanged, it asks GitHub to merge exactly that commit, and GitHub refuses if main moved in the meantime." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" viewbox="0 0 820 316" xmlns="http://www.w3.org/2000/svg"><defs><marker id="mg" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#71717a"></path></marker><marker id="mb" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#2563eb"></path></marker></defs><rect fill="#fafafa" height="72" rx="10" stroke="#ececef" width="820" x="0" y="10"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="50">USER</text><rect fill="#fff" height="72" rx="10" stroke="#ececef" width="820" x="0" y="86"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="126">COORDINATOR</text><rect fill="#fafafa" height="72" rx="10" stroke="#ececef" width="820" x="0" y="162"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="202">GITHUB</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="160" x="110" y="98"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="190.0" y="118.5">1. Test, commit, push</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="190.0" y="134.5">after each run</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="160" x="110" y="174"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="190.0" y="194.5">Pull request</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="190.0" y="210.5">one per task</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="170" x="300" y="22"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="385.0" y="42.5">2. Review, /approve</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="385.0" y="58.5">bound to the head commit</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="170" x="440" y="98"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="525.0" y="118.5">3. Merge latest main</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="525.0" y="134.5">into the task branch</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="170" x="636" y="98"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="721.0" y="118.5">4. Main unchanged</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="721.0" y="134.5">ask GitHub to merge</text><rect class="bx" fill="#eff6ff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="170" x="636" y="174"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="721.0" y="194.5">Merges that commit</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="721.0" y="210.5">refuses if main moved</text><path d="M190 146V172" fill="none" marker-end="url(#mg)" stroke="#71717a" stroke-width="1.5"></path><path d="M270 110C290 110 280 46 298 46" fill="none" marker-end="url(#mg)" stroke="#71717a" stroke-width="1.5"></path><path d="M470 46C500 46 500 98 510 98" fill="none" marker-end="url(#mg)" stroke="#71717a" stroke-width="1.5"></path><path d="M610 122H634" fill="none" marker-end="url(#mg)" stroke="#71717a" stroke-width="1.5"></path><path d="M721 146V172" fill="none" marker-end="url(#mb)" stroke="#2563eb" stroke-width="1.5"></path><text fill="#52525b" font-size="11.5" text-anchor="middle" x="410.0" y="258">Conflict: nothing merges; a new run resolves it, then review again.</text><text fill="#52525b" font-size="11.5" text-anchor="middle" x="410.0" y="276">Main moved: the combined result is tested and approved again before it merges.</text><text fill="#52525b" font-size="11.5" text-anchor="middle" x="410.0" y="294">If GitHub refuses, the Coordinator starts over. Merges run one at a time.</text></svg>
