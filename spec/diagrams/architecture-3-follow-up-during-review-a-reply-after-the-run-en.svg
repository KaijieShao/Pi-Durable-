<svg aria-label="Follow-up during review: a reply after the run ends and before the merge starts another run of the same task, admitted like new work, on the same branch and pull request. If the earlier run finished cleanly and quiescence is confirmed, it reuses the conversation; if it was interrupted, it starts a fresh conversation and the old one is kept read-only." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" viewbox="0 0 820 300" xmlns="http://www.w3.org/2000/svg"><defs><marker id="cg" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#71717a"></path></marker><marker id="cb" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#2563eb"></path></marker><marker id="cr" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#dc2626"></path></marker></defs><rect fill="#fafafa" height="72" rx="10" stroke="#ececef" width="820" x="0" y="10"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="50">USER</text><rect fill="#fff" height="72" rx="10" stroke="#ececef" width="820" x="0" y="86"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="126">COORDINATOR</text><rect fill="#fafafa" height="72" rx="10" stroke="#ececef" width="820" x="0" y="162"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="202">PI</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="170" x="120" y="22"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="205.0" y="42.5">Reply during</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="205.0" y="58.5">review, before merge</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="200" x="320" y="98"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="420.0" y="118.5">Another run, same task</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="420.0" y="134.5">admitted; same branch and PR</text><rect class="bx" fill="#eff6ff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="300" x="210" y="174"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="360.0" y="194.5">Finished cleanly, quiescence confirmed</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="360.0" y="210.5">reuses its conversation</text><rect class="bx" fill="#eff6ff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="280" x="530" y="174"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="670.0" y="194.5">Earlier run interrupted</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="670.0" y="210.5">fresh conversation; old one read-only</text><path d="M290 46C310 46 310 98 318 98" fill="none" marker-end="url(#cg)" stroke="#71717a" stroke-width="1.5"></path><path d="M380 146V172" fill="none" marker-end="url(#cb)" stroke="#2563eb" stroke-width="1.5"></path><path d="M500 146C500 160 640 158 640 172" fill="none" marker-end="url(#cb)" stroke="#2563eb" stroke-width="1.5"></path><text fill="#52525b" font-size="11.5" text-anchor="middle" x="410.0" y="286">After the merge, a reply is rejected; new work is a new /task.</text></svg>
