<svg viewBox="0 0 780 396" role="img" aria-labelledby="vmt vmd" xmlns="http://www.w3.org/2000/svg" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="vmt">What runs on the VM</title><desc id="vmd">One e2-standard-4 VM with a private IPv4 address only. Inside: the watchdog unit, the coordinator unit (Telegram poller, relay, outbox, owner socket), the Pi slice, and agent and check containers with no network. After sealing, a single evaluator container (2 vCPU, 2 GiB, no network) runs; it does not run alongside execution. Dispatch stays held until it exits and cleanup is verified. The watchdog stop path reaches the Pi slice and both agent and check containers. The coordinator reaches Telegram, and the relay reaches the model API, outbound through public Cloud NAT. The operator reaches SSH port 22 only through IAP from 35.235.240.0/20. Secret Manager supplies the model key, Telegram token and GitHub token only to the Coordinator, through the VM service account. IAP and Secret Manager are separate from NAT.</desc><defs><marker id="dg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#71717a"/></marker><marker id="db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="dr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><rect x="200" y="14" width="380" height="368" rx="14" fill="#fafafa" stroke="#e4e4e7"/><text x="216" y="34" font-size="10.5" font-weight="600" letter-spacing=".06em" fill="#a1a1aa" text-anchor="start">E2-STANDARD-4 VM · PRIVATE IPV4 ONLY</text><rect class="bx" x="218" y="48" width="140" height="64" rx="9" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><text x="288.0" y="68.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">watchdog unit</text><text x="288.0" y="84.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">separate stop path</text><text x="288.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">stops slice, containers</text><rect class="bx" x="376" y="48" width="170" height="64" rx="9" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="461.0" y="68.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">coordinator unit</text><text x="461.0" y="84.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">poller · relay · outbox</text><text x="461.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">owner socket</text><rect class="bx" x="218" y="150" width="344" height="52" rx="9" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/><text x="390.0" y="172.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Pi slice</text><text x="390.0" y="188.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">Pi processes, own unprivileged user</text><rect class="bx" x="218" y="240" width="164" height="56" rx="9" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/><text x="300.0" y="264.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Agent containers</text><text x="300.0" y="280.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">no network</text><rect class="bx" x="398" y="240" width="164" height="56" rx="9" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/><text x="480.0" y="264.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Check containers</text><text x="480.0" y="280.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">no network</text><text x="218" y="318" font-size="10.5" font-weight="600" letter-spacing=".06em" fill="#a1a1aa" text-anchor="start">EVALUATION PHASE · AFTER SEALING</text><rect class="bx" x="218" y="326" width="344" height="44" rx="9" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/><text x="390.0" y="344.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Evaluator container</text><text x="390.0" y="360.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">2 vCPU, 2 GiB, no network; not alongside execution</text><path d="M288 112V148" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#dr)"/><text x="294" y="134" text-anchor="start" font-size="11" fill="#dc2626">stop</text><path d="M218 80H208V222H300V238" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#dr)"/><path d="M300 222H480" fill="none" stroke="#dc2626" stroke-width="1.5"/><path d="M480 222V238" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#dr)"/><rect class="bx" x="626" y="48" width="140" height="44" rx="9" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/><text x="696.0" y="66.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Public Cloud NAT</text><text x="696.0" y="82.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">outbound only</text><rect class="bx" x="626" y="112" width="140" height="44" rx="9" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/><text x="696.0" y="130.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Telegram, GitHub</text><text x="696.0" y="146.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">Coordinator only</text><rect class="bx" x="626" y="170" width="140" height="44" rx="9" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/><text x="696.0" y="188.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Model API</text><text x="696.0" y="204.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">relay only</text><path d="M546 70H624" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#dg)"/><text x="585" y="62" text-anchor="middle" font-size="11" fill="#52525b">outbound</text><path d="M696 92V110" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#dg)"/><path d="M766 70H774V192H768" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#dg)"/><rect class="bx" x="626" y="236" width="140" height="52" rx="9" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/><text x="696.0" y="258.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Secret Manager</text><text x="696.0" y="274.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">3 secrets</text><path d="M626 262H596V100H548" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dg)"/><text x="696" y="306" text-anchor="middle" font-size="10.5" fill="#52525b">to Coordinator only</text><rect class="bx" x="14" y="48" width="166" height="44" rx="9" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/><text x="97.0" y="74.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Operator</text><rect class="bx" x="14" y="124" width="166" height="64" rx="9" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/><text x="97.0" y="144.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">IAP</text><text x="97.0" y="160.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">35.235.240.0/20</text><text x="97.0" y="176.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">SSH port 22 only</text><path d="M97 92V122" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#dg)"/><path d="M180 156H198" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#dg)"/></svg>
