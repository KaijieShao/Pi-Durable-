<svg viewBox="0 0 780 380" role="img" aria-labelledby="rrt rrd" xmlns="http://www.w3.org/2000/svg" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="rrt">Restart recovery</title><desc id="rrd">Five recovery steps in order: revoke generations and close run keys; the watchdog kills leftovers and verifies they are gone; reconcile effect evidence and keep uncertain budget reservations; restore relay, hooks and mounts; dispatch queued tasks. An unconfirmed stop or any unresolved effect freezes the group, and all other running tasks in the group are cancelled. Owner review resolves and unfreezes the group, then recovery checks are repeated before dispatch opens for admitted work; interrupted tasks never resume automatically. Reconciliation includes checking GitHub before retrying any GitHub change. A run that was in progress is marked failed, its task keeps its worktree, its conversation is quarantined, and only an authorized follow-up starts an explicitly admitted run of the same task on a fresh conversation.</desc><defs><marker id="rg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#71717a"/></marker><marker id="rb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="rr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><text x="20" y="26" font-size="10.5" font-weight="600" letter-spacing=".06em" fill="#a1a1aa" text-anchor="start">RESTART STEPS, IN ORDER</text><rect class="bx" x="20" y="38" width="130" height="64" rx="9" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="85.0" y="58.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">1. Revoke</text><text x="85.0" y="74.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">generations,</text><text x="85.0" y="90.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">close run keys</text><rect class="bx" x="172" y="38" width="130" height="64" rx="9" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="237.0" y="58.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">2. Kill leftovers</text><text x="237.0" y="74.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">watchdog verifies</text><text x="237.0" y="90.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">they are gone</text><rect class="bx" x="324" y="38" width="130" height="64" rx="9" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="389.0" y="58.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">3. Reconcile</text><text x="389.0" y="74.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">effect evidence, merges</text><text x="389.0" y="90.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">uncertain reservations</text><rect class="bx" x="476" y="38" width="130" height="64" rx="9" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="541.0" y="58.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">4. Restore</text><text x="541.0" y="74.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">relay, hooks,</text><text x="541.0" y="90.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">mounts</text><rect class="bx" x="628" y="38" width="130" height="64" rx="9" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="693.0" y="58.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">5. Dispatch</text><text x="693.0" y="74.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">queued tasks</text><text x="693.0" y="90.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">again</text><path d="M150 70H170" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#rg)"/><path d="M302 70H322" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#rg)"/><path d="M454 70H474" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#rg)"/><path d="M606 70H626" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#rg)"/><path d="M237 102V146" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rr)"/><text x="244" y="128" font-size="11" fill="#dc2626">stop unconfirmed</text><path d="M389 102V132H300V146" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rr)"/><text x="396" y="128" font-size="11" fill="#dc2626">any effect unresolved</text><rect class="bx" x="20" y="148" width="330" height="64" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="185.0" y="168.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Group frozen</text><text x="185.0" y="184.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">cancels all other running tasks</text><text x="185.0" y="200.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">blocks dispatch</text><path d="M350 180H378" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#rg)"/><rect class="bx" x="380" y="148" width="160" height="64" rx="9" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/><text x="460.0" y="176.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Owner CLI</text><text x="460.0" y="192.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">resolve, then unfreeze</text><path d="M540 180H568" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#rg)"/><rect class="bx" x="570" y="148" width="190" height="64" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="665.0" y="168.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Recheck steps 1–4</text><text x="665.0" y="184.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">new admitted work only</text><text x="665.0" y="200.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">no automatic resume</text><path d="M665 148V122H693V104" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#rg)"/><text x="20" y="286" font-size="10.5" font-weight="600" letter-spacing=".06em" fill="#a1a1aa" text-anchor="start">A RUN IN PROGRESS</text><rect class="bx" x="20" y="300" width="130" height="52" rx="9" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/><text x="85.0" y="322.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Run in progress</text><text x="85.0" y="338.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">at restart</text><rect class="bx" x="172" y="300" width="150" height="52" rx="9" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/><text x="247.0" y="322.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Marked failed</text><text x="247.0" y="338.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">interrupted by restart</text><rect class="bx" x="344" y="300" width="150" height="52" rx="9" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/><text x="419.0" y="322.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Conversation</text><text x="419.0" y="338.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">quarantined; worktree kept</text><rect class="bx" x="530" y="294" width="230" height="64" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="645.0" y="314.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Fresh conversation</text><text x="645.0" y="330.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">another run, explicitly admitted</text><text x="645.0" y="346.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">only after an authorized follow-up</text><path d="M150 326H170" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#rg)"/><path d="M322 326H342" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#rg)"/><path d="M494 326H528" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rb)"/></svg>
