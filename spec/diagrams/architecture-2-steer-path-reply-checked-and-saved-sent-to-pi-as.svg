<svg aria-label="Steer path: reply checked and saved, sent to Pi as a steer with the update ID as requestId, delivered after the current tool round within the same task. If unconsumed at normal completion, it becomes a successor run under the same limits, or expires if the 30-request cap is reached. Normal finalize waits for the successor run to drain." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" viewbox="0 0 820 300" xmlns="http://www.w3.org/2000/svg"><defs><marker id="sg" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#71717a"></path></marker><marker id="sb" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#2563eb"></path></marker><marker id="sr" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#dc2626"></path></marker></defs><rect fill="#fafafa" height="72" rx="10" stroke="#ececef" width="820" x="0" y="10"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="50">USER</text><rect fill="#fff" height="72" rx="10" stroke="#ececef" width="820" x="0" y="86"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="126">COORDINATOR</text><rect fill="#fafafa" height="72" rx="10" stroke="#ececef" width="820" x="0" y="162"></rect><text fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing=".06em" text-anchor="start" x="14" y="202">PI</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#d4d4d8" stroke-width="1.5" width="150" x="120" y="22"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="195.0" y="42.5">Reply to status</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="195.0" y="58.5">message</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="170" x="300" y="98"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="385.0" y="118.5">Check permission</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="385.0" y="134.5">and limits, then save</text><rect class="bx" fill="#fff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="150" x="500" y="98"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="575.0" y="118.5">Send to Pi</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="575.0" y="134.5">whenBusy: "steer"</text><rect class="bx" fill="#eff6ff" height="48" rx="9" stroke="#2563eb" stroke-width="1.5" width="300" x="500" y="174"></rect><text fill="#18181b" font-size="13" font-weight="600" text-anchor="middle" x="650.0" y="194.5">Delivered after the current tool round</text><text fill="#52525b" font-size="11.5" font-weight="400" text-anchor="middle" x="650.0" y="210.5">same task, deadline, request count, budget</text><path d="M270 46C290 46 290 98 298 98" fill="none" marker-end="url(#sg)" stroke="#71717a" stroke-width="1.5"></path><path d="M470 98H498" fill="none" marker-end="url(#sg)" stroke="#71717a" stroke-width="1.5"></path><path d="M575 148V172" fill="none" marker-end="url(#sb)" stroke="#2563eb" stroke-width="1.5"></path><text fill="#2563eb" font-size="11" text-anchor="start" x="585" y="159">requestId = update ID</text><text fill="#52525b" font-size="11.5" text-anchor="middle" x="410.0" y="254">Accepted steer unconsumed at normal completion:</text><text fill="#52525b" font-size="11.5" text-anchor="middle" x="410.0" y="270">becomes a successor run in the same task; expires if the 30-request cap is reached.</text><text fill="#52525b" font-size="11.5" text-anchor="middle" x="410.0" y="286">Normal finalize waits until Pi is idle and any successor run has drained.</text></svg>
