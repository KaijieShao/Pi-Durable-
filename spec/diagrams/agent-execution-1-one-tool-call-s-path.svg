<svg viewBox="0 0 780 356" role="group" aria-labelledby="tct tcd" xmlns="http://www.w3.org/2000/svg" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="tct">One tool call’s path</title><desc id="tcd">Pi routes each call through the policy hook before container execution. An allowed call runs in the agent or read-only check container. Denials return to Pi and the model as errors. Protected files are absent from both container views.</desc><defs><marker id="tg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#71717a"/></marker><marker id="tb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><rect x="20" y="20" width="290" height="52" rx="10" fill="#fafafa" stroke="#a1a1aa" stroke-dasharray="5 4"/><text x="165" y="41" text-anchor="middle" font-size="12.5" font-weight="600" fill="#52525b">Protected files: not in agent or check views</text><text x="165" y="58" text-anchor="middle" font-size="11" fill="#71717a">credentials, system-control files, hidden tests</text><rect class="bx" x="20" y="112" width="100" height="48" rx="9" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/><text x="70.0" y="132.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Model</text><text x="70.0" y="148.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">names a call</text><rect class="bx" x="146" y="112" width="114" height="48" rx="9" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="203.0" y="132.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Pi harness</text><text x="203.0" y="148.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">routes the call</text><g class="hit" id="tc-hook" tabindex="0" role="button" aria-expanded="false" aria-controls="tc-rules" aria-label="Policy hook: show rule order"><rect class="bx" x="286" y="104" width="140" height="64" rx="9" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="356.0" y="124.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Policy hook</text><text x="356.0" y="140.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">every call</text><text x="356.0" y="156.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">select for rule order</text></g><rect x="470" y="14" width="290" height="116" rx="12" fill="#fff" stroke="#a1a1aa" stroke-dasharray="6 4"/><text x="484" y="34" font-size="10.5" font-weight="600" letter-spacing=".06em" fill="#a1a1aa" text-anchor="start">AGENT CONTAINER</text><rect x="484" y="46" width="262" height="18" rx="9" fill="#fafafa" stroke="#ececef"/><text x="496" y="58.5" font-size="11.5" fill="#15803d">Task worktree: read-write</text><rect x="484" y="68" width="262" height="18" rx="9" fill="#fafafa" stroke="#ececef"/><text x="496" y="80.5" font-size="11.5" fill="#52525b">No other worktrees or git data</text><rect x="484" y="90" width="262" height="18" rx="9" fill="#fafafa" stroke="#ececef"/><text x="496" y="102.5" font-size="11.5" fill="#3f3f46">read · edit · write</text><rect x="470" y="148" width="290" height="116" rx="12" fill="#fff" stroke="#a1a1aa" stroke-dasharray="6 4"/><text x="484" y="168" font-size="10.5" font-weight="600" letter-spacing=".06em" fill="#a1a1aa" text-anchor="start">RUN_CHECK CONTAINER</text><rect x="484" y="180" width="262" height="18" rx="9" fill="#fafafa" stroke="#ececef"/><text x="496" y="192.5" font-size="11.5" fill="#52525b">Task worktree: read-only</text><rect x="484" y="202" width="262" height="18" rx="9" fill="#fafafa" stroke="#ececef"/><text x="496" y="214.5" font-size="11.5" fill="#15803d">Scratch space: wiped after each check</text><rect x="484" y="224" width="262" height="18" rx="9" fill="#fafafa" stroke="#ececef"/><text x="496" y="236.5" font-size="11.5" fill="#3f3f46">Listed run_check operations</text><rect class="bx" x="286" y="206" width="140" height="44" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="356.0" y="224.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Denied</text><text x="356.0" y="240.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">or fails closed</text><path d="M120 136H144" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#tg)"/><path d="M260 136H284" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#tg)"/><path d="M426 124C448 124 448 72 468 72" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#tg)"/><text x="440" y="92" text-anchor="end" font-size="11" fill="#52525b">allow</text><path d="M426 148C448 148 448 206 468 206" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#tg)"/><path d="M356 168V204" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#tr)"/><text x="364" y="191" text-anchor="start" font-size="11" fill="#dc2626">deny</text><rect class="bx" x="520" y="296" width="210" height="48" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="625.0" y="316.5" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Tool result</text><text x="625.0" y="332.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52525b">capped at 16 KiB, truncation marked</text><path d="M760 72H774V320H732" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#tb)"/><path d="M760 206H774" fill="none" stroke="#2563eb" stroke-width="1.5"/><path d="M520 320H203V162" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#tb)"/><text x="360" y="312" text-anchor="middle" font-size="11" fill="#2563eb">returned to Pi, then the model</text><path d="M286 228H203V162" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#tr)"/><text x="185" y="258" text-anchor="end" font-size="11" fill="#dc2626">denial returned to the model</text><text x="185" y="274" text-anchor="end" font-size="11" fill="#dc2626">as an error</text></svg>
